<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiara</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/css/styles.css">
<link rel="stylesheet" href="/static/css/sidebar.css">
</head>

<body>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<nav class="sidebar" id="sidebar" aria-hidden="true" aria-label="Menú de navegación">
  <div class="sidebar-header">
    <span class="sidebar-title">Menú</span>
    <button class="sidebar-close" id="sidebar-close" aria-label="Cerrar menú">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sidebar-links">
    <a href="/" class="sidebar-link" data-page="chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Chat</span>
    </a>
    <a href="/admin" class="sidebar-link" data-page="admin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Panel de Administración</span>
    </a>
  </div>
  <div class="sidebar-footer">
    <button class="sidebar-link sidebar-logout" id="sidebar-logout" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Cerrar sesión</span>
    </button>
  </div>
</nav>

<header>
  <div class="header-left">
    <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="logo-wrap">

      <img src="/static/img/SAC-Logo.jpg" class="logo-img" alt="SAC Logo">

      <div class="logo-sub">
        Servicios Avanzados de Consultoría
      </div>

    </div>
  </div>

  <h1 class="header-title"><span class="t-blue">TI</span><span class="t-celeste">A</span><span class="t-orange">RA</span></h1>
</header>

<main>
  <div class="welcome-screen" id="welcome-screen">
    <h2>Bienvenido a TIARA</h2>
    <p>¿En qué puedo ayudarte hoy?</p>
  </div>
  <div id="chat-container"></div>
</main>

<div id="offline-banner" class="offline-banner">Sin conexión a internet — los mensajes no se enviarán</div>

<div class="input-area">

  <div class="input-inner">

    <input
      type="text"
      id="user-input"
      placeholder="Escribe tu pregunta aquí"
      autocomplete="off"
    />

    <div class="btn-row">
      <button class="btn btn-reset hidden" id="reset-btn">
        Reiniciar Conversación
      </button>

      <button class="btn btn-send" id="send-btn">
        Enviar Mensaje
      </button>
    </div>

  </div>

</div>

<script src="/static/js/sidebar.js"></script>
<script src="/static/js/chat.js"></script>

</body>
</html>
